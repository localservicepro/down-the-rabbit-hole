name: Fetch job photos from Google Drive
# One-off helper: pulls the client's photos from the shared Drive folder,
# converts them to WebP and commits them to the branch. Run manually.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow gdown
      - run: python tools/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Add job photos converted to WebP" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
