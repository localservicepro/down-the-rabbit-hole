name: inspect-tracker (temporary)
on:
  push:
    branches: [claude/laughing-davinci-sk12jh]
    paths: ['.github/workflows/inspect-tracker.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and inspect the CRM tracking script
        run: |
          curl -sSL https://app.downtherabbitholeaust.com/js/external-tracking.js -o t.js
          echo "bytes: $(wc -c < t.js)"
          echo "--- readyState / DOMContentLoaded / load listeners ---"
          grep -o -E '.{0,120}(readyState|DOMContentLoaded|addEventListener\(.load.).{0,160}' t.js | head -20
          echo "--- submit listeners ---"
          grep -o -E '.{0,160}("submit"|.submit.,).{0,200}' t.js | head -12
          echo "--- currentScript / data-tracking-id ---"
          grep -o -E '.{0,100}(currentScript|tracking-id|trackingId).{0,120}' t.js | head -12
          echo "--- head of file ---"
          head -c 1500 t.js; echo
          echo "--- tail of file ---"
          tail -c 1500 t.js
